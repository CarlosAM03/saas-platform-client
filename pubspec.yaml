name: saas_platform_client
description: Flutter client foundation for the university SaaS platform.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.8.0+1
  envied: ^1.1.1
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  go_router: ^15.1.2
  json_annotation: ^4.9.0
  logger: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.15
  envied_generator: ^1.1.1
  flutter_lints: ^5.0.0
  json_serializable: ^6.9.5
  mockito: ^5.4.5

# 2.6.0 introduces an Objective-C native build hook that fails on this
# Windows workspace path before Flutter tests can start.
dependency_overrides:
  path_provider_foundation: 2.5.1

flutter:
  uses-material-design: true
